services:
  - type: web
    name: newspaper-agency
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn newspaper-agency-mate.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newspaper_db
          property: connectionString
      - key: SECRET_KEY
        value: твій_секретний_ключ
      - key: DEBUG
        value: "False"
