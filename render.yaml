services:
  - type: web
    name: newspaper-agency
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn newspaper_agency_mate.wsgi:application
    pythonVersion: "3.14.3"
    repo: https://github.com/viacheslav-kolesnyk/newspaper-agency-mate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newspaper_db
          property: connectionString
      - key: SECRET_KEY
        value: твій_секретний_ключ
      - key: DEBUG
        value: "False"
