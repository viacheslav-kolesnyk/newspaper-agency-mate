<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Newspaper Agency Management Platform{% endblock %}</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Main Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'newspaper:index' %}">📰 Newspaper Agency</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'newspaper:index' %}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'newspaper:topic-list' %}">Topics</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'newspaper:newspaper-list' %}">Newspapers</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'newspaper:editor-list' %}">Editors</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          {% if user.is_authenticated %}
            <span class="navbar-text me-3 text-white">Hello, <strong>{{ user.username }}</strong></span>
            <form action="{% url 'logout' %}" method="post" class="m-0">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="btn btn-sm btn-outline-success">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Core Content Injection Wrapper -->
  <main class="container">
    <div class="row">
      <div class="col-12">
        {% block content %}
        <!-- Dynamic templates inject content here -->
        {% endblock %}
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
