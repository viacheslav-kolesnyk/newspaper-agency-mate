{% extends "base.html" %}

{% block content %}
  <h1>Topics</h1>
  <a href="{% url 'newspaper:topic-create' %}" class="btn btn-primary mb-3">Add New Topic</a>

  <ul class="list-group">
    {% for topic in topic_list %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ topic.name }}
        <div>
          <a href="{% url 'newspaper:topic-update' pk=topic.id %}" class="btn btn-sm btn-secondary">Edit</a>
          <a href="{% url 'newspaper:topic-delete' pk=topic.id %}" class="btn btn-sm btn-danger">Delete</a>
        </div>
      </li>
    {% empty %}
      <li class="list-group-item">No topics available.</li>
    {% endfor %}
  </ul>
{% endblock %}
