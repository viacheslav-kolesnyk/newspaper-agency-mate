{% extends "base.html" %}

{% block content %}
  <h1>Editors</h1>

  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Username</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for editor in editor_list %}
        <tr>
          <td>{{ editor.username }}</td>
          <td>{{ editor.first_name }}</td>
          <td>{{ editor.last_name }}</td>
          <td>
            <a href="{% url 'newspaper:editor-detail' pk=editor.id %}" class="btn btn-sm btn-outline-primary">View Profile</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4" class="text-center text-muted">No editors registered.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
